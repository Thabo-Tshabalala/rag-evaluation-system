spring.application.name=RAG

server.port=8090
# --- PostgreSQL Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/rag_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- PGVector Auto-Schema ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.google.genai.project-id=pep-apps-pln-planning-dev
spring.ai.google.genai.location=europe-west1
spring.ai.google.genai.chat.model=gemini-2.5-flash

spring.ai.google.genai.embedding.project-id=pep-apps-pln-planning-dev
spring.ai.google.genai.embedding.location=europe-west1

spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.embedding.text.dimensions=768


rag.indexing.enabled=false
spring.ai.google.genai.chat.options.temperature=0.0
spring.ai.google.genai.chat.options.max-output-tokens=1024